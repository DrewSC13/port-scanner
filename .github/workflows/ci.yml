name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  RUST_TOOLCHAIN: "1.97.1"
  GO_VERSION: "1.26.5"

jobs:
  python-tests:
    name: Python tests (${{ matrix.os }}, ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
      - name: Run Python tests
        run: python -m pytest -v --cov=src --cov-report=term-missing

  package-build:
    name: Build release-candidate artifacts
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Install Rust 1.97.1
        run: |
          rustup toolchain install 1.97.1 --profile minimal --component rustfmt,clippy
          rustup default 1.97.1
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26.5"
          cache: false
      - name: Install release tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-release.txt
      - name: Build and verify wheel and sdist
        run: ./scripts/build_release_artifacts.sh
      - uses: actions/upload-artifact@v4
        with:
          name: cicadaport-3.0.0-rc.1-linux-x86_64
          path: dist/
          if-no-files-found: error
          retention-days: 30

  package-install:
    name: Installed artifacts (${{ matrix.os }}, Python ${{ matrix.python-version }})
    needs: package-build
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install Rust 1.97.1
        run: |
          rustup toolchain install 1.97.1 --profile minimal
          rustup default 1.97.1
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26.5"
          cache: false
      - uses: actions/download-artifact@v4
        with:
          name: cicadaport-3.0.0-rc.1-linux-x86_64
          path: dist
      - name: Install and execute wheel and sdist outside checkout
        run: ./scripts/test_release_artifacts.sh dist

  rust:
    name: Rust 1.97.1
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust 1.97.1
        run: |
          rustup toolchain install 1.97.1 --profile minimal --component rustfmt,clippy
          rustup default 1.97.1
      - run: cargo fmt --manifest-path rust-core/Cargo.toml -- --check
      - run: cargo clippy --manifest-path rust-core/Cargo.toml --all-targets --all-features -- -D warnings
      - run: cargo test --locked --manifest-path rust-core/Cargo.toml
      - run: cargo build --release --locked --manifest-path rust-core/Cargo.toml

  go:
    name: Go 1.26.5
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26.5"
          cache: false
      - name: Check Go formatting
        working-directory: go-banner
        run: |
          unformatted="$(gofmt -l .)"
          [[ -z "$unformatted" ]] || { printf 'Unformatted Go files:\n%s\n' "$unformatted"; exit 1; }
      - working-directory: go-banner
        run: go mod verify
      - working-directory: go-banner
        run: go vet ./...
      - working-directory: go-banner
        run: go test -race ./...
      - working-directory: go-banner
        run: CGO_ENABLED=0 go build -trimpath -o "${RUNNER_TEMP}/go-banner" .

  shell:
    name: Shell
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Install ShellCheck
        run: |
          sudo apt-get update
          sudo apt-get install --yes shellcheck
      - run: bash -n scripts/*.sh
      - run: shellcheck scripts/*.sh

  security-audit:
    name: Dependency audits
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Install Rust 1.97.1
        run: |
          rustup toolchain install 1.97.1 --profile minimal
          rustup default 1.97.1
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26.5"
          cache: false
      - name: Install audit tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install "pip-audit>=2.9,<3"
          cargo install cargo-audit --version 0.22.2 --locked
          go install golang.org/x/vuln/cmd/govulncheck@v1.1.4
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - run: ./scripts/audit_dependencies.sh

  integration:
    name: Integration (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    needs: [python-tests, rust, go, shell]
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26.5"
          cache: false
      - name: Install Rust 1.97.1
        run: |
          rustup toolchain install 1.97.1 --profile minimal --component rustfmt,clippy
          rustup default 1.97.1
      - name: Create integration environment
        run: |
          integration_venv="${RUNNER_TEMP}/cicadaport-integration-venv"
          python -m venv "$integration_venv"
          "$integration_venv/bin/python" -m pip install --upgrade pip
          "$integration_venv/bin/python" -m pip install -r requirements-dev.txt
          echo "VIRTUAL_ENV=$integration_venv" >> "$GITHUB_ENV"
          echo "$integration_venv/bin" >> "$GITHUB_PATH"
      - run: ./scripts/build_all.sh
      - run: ./scripts/test_all.sh
